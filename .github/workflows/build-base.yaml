name: Build and publish latex-base

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.base"
      - "texlive.profile"
      - ".github/workflows/build-base.yaml"
      - "tests/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile.base"
      - "texlive.profile"
      - ".github/workflows/build-base.yaml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: latex-base
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract TeX Live year from Dockerfile.base
        id: tl
        run: |
          year=$(grep 'ARG TL_YEAR=' Dockerfile.base | cut -d= -f2)
          echo "year=${year}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tl.outputs.year }}
            type=raw,value=${{ steps.tl.outputs.year }}-{{date 'YYYYMMDD'}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve local image name for testing
        id: img
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.tl.outputs.year }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.tl.outputs.year }}" >> $GITHUB_OUTPUT
          fi

      - name: Test pdfLaTeX
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ steps.img.outputs.ref }} \
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp pdflatex.tex

      - name: Test LuaLaTeX + Japanese
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ steps.img.outputs.ref }} \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp lualatex.tex

      - name: Test biber
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ steps.img.outputs.ref }} \
            sh -c "cd /work && latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp biber.tex"
