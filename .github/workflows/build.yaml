name: Build and publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "texlive.profile"
      - ".github/workflows/build.yaml"
      - "tests/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "texlive.profile"
      - ".github/workflows/build.yaml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract TeX Live year
        id: tl
        run: |
          year=$(grep 'ARG TL_YEAR=' Dockerfile | cut -d= -f2)
          echo "year=${year}" >> $GITHUB_OUTPUT

      # ── latex-base stage ────────────────────────────────────────────────
      # Builds the TeX Live stage and pushes it as ghcr.io/{owner}/latex-base.
      # Also writes the GHA cache so the latex stage reuses these layers.
      - name: Docker metadata (latex-base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex-base
          tags: |
            type=raw,value=${{ steps.tl.outputs.year }}
            type=raw,value=${{ steps.tl.outputs.year }}-{{date 'YYYYMMDD'}}

      - name: Build and push latex-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: latex-base
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── latex stage ─────────────────────────────────────────────────────
      # Builds the final image on top of the cached latex-base layers.
      - name: Docker metadata (latex)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push latex
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # ── tests ────────────────────────────────────────────────────────────
      - name: Test pdfLaTeX
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex:latest \
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp pdflatex.tex

      - name: Test LuaLaTeX + Japanese
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex:latest \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp lualatex.tex

      - name: Test biber
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex:latest \
            sh -c "cd /work && latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp biber.tex"

      - name: Test npm (non-root user)
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex:latest \
            npm --version
