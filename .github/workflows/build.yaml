name: Build and publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yaml"
      - "tests/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yaml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: latex
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test pdfLaTeX
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest \
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp pdflatex.tex

      - name: Test LuaLaTeX
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests":/work \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -output-directory=/tmp lualatex.tex

      - name: Test npm (non-root user)
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest \
            npm --version
