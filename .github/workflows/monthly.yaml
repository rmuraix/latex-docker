name: Tag GHCR monthly

on:
  pull_request:
    types: ["closed"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  tag-monthly:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      contains(github.event.pull_request.labels.*.name, 'monthly') &&
      github.event.pull_request.user.id == 29139614
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract TeX Live year
        id: tl
        run: |
          year=$(grep 'ARG TL_YEAR=' Dockerfile | cut -d= -f2)
          echo "year=${year}" >> $GITHUB_OUTPUT

      - name: Docker metadata (latex-base)
        id: meta-base
        env:
          TZ: Asia/Tokyo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex-base
          tags: |
            type=raw,value=${{ steps.tl.outputs.year }}
            type=raw,value=${{ steps.tl.outputs.year }}-{{date 'YYYYMMDD'}}

      - name: Docker metadata (latex)
        id: meta
        env:
          TZ: Asia/Tokyo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/latex
          tags: |
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push latex-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: latex-base
          push: true
          provenance: false
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push latex
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
